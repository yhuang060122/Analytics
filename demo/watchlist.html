<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Watchlist · Analytics Demo</title>
  </head>
  <body>
    <main class="wrap">

      <header class="page-head">
        <a class="crumb" href="/index.html">← Back to demo home</a>
        <h1>Watchlist</h1>
        <p class="lead">
          A second page: verifies the session and the queue
          behave consistently across navigation.
        </p>
      </header>

      <section class="card">
        <h2>Watchlist</h2>
        <div class="row">
          <button class="btn" data-analytics="Open AAPL">Open AAPL</button>
          <button class="btn ghost" data-analytics="Favorite AAPL">
            Favorite AAPL
          </button>
        </div>
        <div class="row">
          <button class="btn" data-analytics="Open MSFT">Open MSFT</button>
          <button class="btn ghost" data-analytics="Favorite MSFT">
            Favorite MSFT
          </button>
        </div>
      </section>

      <section class="card">
        <h2>News</h2>
        <p>
          Failures are visible too: switch on
          <b>Outage</b> in the toolbar, then reload.
        </p>
        <div class="row">
          <button class="btn" id="loadNews">Load News</button>
        </div>
        <ul class="list" id="news">
          <li class="empty">Not loaded yet</li>
        </ul>
      </section>


    </main>

    <script type="module" src="/src/watchlist.ts"></script>
  </body>
</html>
