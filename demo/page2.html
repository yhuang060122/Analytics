
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Watchlist</title>

  <style>
    body{
      font-family:Arial;
      max-width:800px;
      margin:40px auto;
    }

    button{
      padding:10px 18px;
      margin:8px;
      cursor:pointer;
    }

    .stock{
      border:1px solid #ddd;
      border-radius:8px;
      padding:16px;
      margin-top:16px;
    }
  </style>
</head>

<body>

<h1>⭐ Watchlist</h1>

<a href="page1.html">← Back to Portfolio</a>

<div class="stock">

  <h3>Apple</h3>

  <button data-analytics="Open AAPL">
    Open
  </button>

  <button data-analytics="Favorite AAPL">
    Favorite
  </button>

</div>

<div class="stock">

  <h3>Microsoft</h3>

  <button data-analytics="Open MSFT">
    Open
  </button>

  <button data-analytics="Favorite MSFT">
    Favorite
  </button>

</div>

<button id="loadNews">
  Load News
</button>

<script src="./analytics.js"></script>

<script>
const analytics = new Analytics({
  endpoint:"http://localhost:5000/api/analytics/events",
  debug:{
    enabled:true,
    console:true,
    inspector:true
  }
});

window.analytics = analytics;

analytics.page();

new ClickTracker(analytics).start();
new PageTracker(analytics).start();

document.getElementById("loadNews")
  .addEventListener("click", async ()=>{

    analytics.track("Load News");

    await fetch("https://jsonplaceholder.typicode.com/comments");

  });
</script>

</body>
</html>
