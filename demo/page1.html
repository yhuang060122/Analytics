
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Portfolio</title>
  <style>
    body{
      font-family:Arial;
      max-width:800px;
      margin:40px auto;
    }
    button{
      padding:10px 18px;
      margin:8px;
      cursor:pointer;
    }
    .card{
      border:1px solid #ddd;
      padding:20px;
      border-radius:10px;
      margin-top:20px;
    }
  </style>
</head>

<body>

<h1>📈 Portfolio Page</h1>

<a href="page2.html">Go to Watchlist →</a>

<div class="card">

  <h2>NVDA</h2>

  <button data-analytics="Buy NVDA">
    Buy
  </button>

  <button data-analytics="Sell NVDA">
    Sell
  </button>

  <button id="refreshBtn">
    Refresh Portfolio
  </button>

</div>

<script src="./analytics.js"></script>

<script>
const analytics = new Analytics({
  endpoint:"http://localhost:5000/api/analytics/events",
  debug:{
    enabled:true,
    console:true,
    inspector:true
  }
});

window.analytics = analytics;

analytics.page();

new ClickTracker(analytics).start();
new PageTracker(analytics).start();

document.getElementById("refreshBtn")
  .addEventListener("click", async ()=>{

    analytics.track("Refresh Portfolio");

    await fetch("https://jsonplaceholder.typicode.com/posts/1");

  });
</script>

</body>
</html>
