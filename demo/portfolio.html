<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Portfolio · Analytics Demo</title>
  </head>
  <body>
    <main class="wrap">

      <header class="page-head">
        <a class="crumb" href="/index.html">← Back to demo home</a>
        <h1>Portfolio</h1>
        <p class="lead">
          Page views and automatic click tracking.
        </p>
      </header>

      <section class="card">
        <h2>NVDA</h2>
        <div class="row">
          <button class="btn" id="buyBtn" data-analytics="Buy NVDA">
            Buy
          </button>
          <button class="btn ghost" data-analytics="Sell NVDA">
            Sell
          </button>
        </div>
      </section>

      <section class="card">
        <h2>Holdings</h2>
        <p>
          Refresh calls <code>fetch("/api/portfolio")</code>.
          The SDK does not intercept it — network tracking was
          removed, so this request produces no event.
        </p>
        <div class="row">
          <button class="btn" id="refreshBtn">Refresh Portfolio</button>
        </div>
        <ul class="list" id="holdings">
          <li class="empty">Not loaded yet</li>
        </ul>
      </section>


    </main>

    <script type="module" src="/src/portfolio.ts"></script>
  </body>
</html>
